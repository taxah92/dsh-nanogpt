# Слой бандла dsh-nanogpt.
#
# Одна строка плагина. `id` — пространство настроек плагина: сервис `settings`
# адресует плагин по id его строки в профиле и строит форму из экспортируемой
# схемы `Config`. `name` — имя пакета.
#
# Конфиг здесь намеренно не задан: значения по умолчанию берёт схема, а правки
# из формы настроек сервис сам записывает в патч-слой профиля.
- insert:
    - id: nanogpt
      name: dsh-nanogpt
