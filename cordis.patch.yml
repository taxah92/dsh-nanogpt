# Bundle layer for dsh-nanogpt.
#
# One plugin row. `id` is the plugin's settings namespace: the `settings`
# service addresses the plugin by the id of its profile row and builds the form
# from the exported `Config` schema. `name` is the package name.
#
# The config is deliberately absent here: the schema supplies the defaults, and
# edits made in the settings form are written back into the profile patch layer
# by the service itself.
- insert:
    - id: nanogpt
      name: dsh-nanogpt
